# WP19 (plan §10.46): publish the five public packages to npm on a version tag.
# Requires npm "trusted publishing" (OIDC) configured on npmjs.com, per package,
# for this repository + workflow file. A re-run skips what is already published.
name: Release

on:
  push:
    tags: ['v*']
  # Manual re-run from main when a tagged run failed before publishing.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11
      # pnpm packs (it rewrites workspace:* dependencies); npm publishes the
      # tarballs over OIDC. No token: provenance is attached automatically.
      - name: Pack
        run: >-
          pnpm --filter @wdf-dev/core --filter @wdf-dev/import --filter @wdf-dev/viewer
          --filter @wdf-dev/cli --filter @wdf-dev/mcp
          exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
      - name: Publish to npm (trusted publishing, dependency order)
        run: |
          set -euo pipefail
          for name in core import viewer cli mcp; do
            version=$(node -p "require('./packages/$name/package.json').version")
            if npm view "@wdf-dev/$name@$version" version >/dev/null 2>&1; then
              echo "@wdf-dev/$name@$version already published - skipping"
              continue
            fi
            npm publish "./tarballs/wdf-dev-$name-$version.tgz" --access public
          done
