name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # T18.7: the extension e2e runs the REAL extension in full Chromium
      # (new headless; the headless shell cannot load extensions).
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        # No --with-deps: it installs system packages with apt, and the run
        # then depends on Ubuntu's mirrors resolving (they did not, three
        # times, on 11 Nov 2026). The hosted runner already has the libraries
        # a browser needs; if one is ever missing, the e2e step says so.
        run: pnpm --filter @wdf-dev/extension exec playwright install chromium
      - name: Extension e2e (real browser)
        run: pnpm --filter @wdf-dev/extension test:e2e
