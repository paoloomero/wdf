# WP19 (plan §10.46): publish the five public packages to npm on a version tag.
# Requires npm "trusted publishing" (OIDC) configured on npmjs.com for this
# repository+workflow — or, as a fallback, an NPM_TOKEN granular secret.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Publish to npm (with provenance)
        run: >-
          pnpm --filter @wdf-dev/core --filter @wdf-dev/import --filter @wdf-dev/viewer
          --filter @wdf-dev/cli --filter @wdf-dev/mcp publish
          --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
